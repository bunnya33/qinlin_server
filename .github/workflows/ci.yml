name: Go checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test web/request-id.test.cjs
      - run: go build ./cmd/qinlin
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck bootstrap.sh install.sh deploy/manage.sh
      - run: python3 -m py_compile tests/linux-smoke.py
      - run: CGO_ENABLED=0 go build -o bin/qinlin-linux-amd64 ./cmd/qinlin
      - name: Download published bootstrap
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: curl -fsSL --connect-timeout 15 --max-time 90 --retry 2 https://raw.githubusercontent.com/bunnya33/qinlin_server/main/bootstrap.sh -o /tmp/qinlin-bootstrap.sh
      - name: Verify Linux installation and management
        env:
          QINLIN_TEST_BOOTSTRAP: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '/tmp/qinlin-bootstrap.sh' || '' }}
        run: sudo QINLIN_PREBUILT_BINARY="$PWD/bin/qinlin-linux-amd64" QINLIN_TEST_BOOTSTRAP="$QINLIN_TEST_BOOTSTRAP" python3 tests/linux-smoke.py
