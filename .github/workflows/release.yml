name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - run: go test -race ./...
      - run: node --test web/*.test.cjs
      - name: Build release programs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            platform=${target%/*}
            architecture=${target#*/}
            output="dist/qinlin-server_${platform}_${architecture}"
            [[ $platform != windows ]] || output+=.exe
            CGO_ENABLED=0 GOOS="$platform" GOARCH="$architecture" go build -trimpath \
              -ldflags="-s -w -X qinlin/internal/version.Version=${RELEASE_TAG#v} -X qinlin/internal/version.Revision=$RELEASE_REVISION" \
              -o "$output" ./cmd/qinlin
          done
          (cd dist && sha256sum qinlin-server_* > SHA256SUMS)
      - name: Package offline Linux installers
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REVISION: ${{ github.sha }}
        run: python3 scripts/package-offline.py --version "$RELEASE_TAG" --revision "$RELEASE_REVISION" --binary-dir dist
      - name: Verify offline installation and management
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: sudo python3 tests/offline-smoke.py "dist/qinlin-${RELEASE_TAG}-linux-amd64.tar.gz"
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --generate-notes
      - name: Build an older version for the published update test
        run: CGO_ENABLED=0 go build -ldflags='-X qinlin/internal/version.Version=0.2.99' -o bin/qinlin-update-baseline ./cmd/qinlin
      - name: Verify the published download and restart on systemd
        run: sudo QINLIN_PREBUILT_BINARY="$PWD/bin/qinlin-update-baseline" QINLIN_TEST_PUBLISHED_UPDATE=1 python3 tests/linux-smoke.py
